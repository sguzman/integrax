name: IXG2 dictionary capacity and training coverage
on:
  push:
    paths:
      - 'experiments/ixg2/dictionaries.sh'
      - '.github/workflows/ixg2-dictionaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik8
      - run: bash experiments/ixg2/dictionaries.sh
