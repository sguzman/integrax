name: IXG2 independent longer context verification
on:
  push:
    paths:
      - 'experiments/oracle/root-intervals-context-cross.mjs'
      - '.github/workflows/ixg2-context-cross.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && rustc --version
      - run: cargo build --release --locked --bin ixg2
      - run: node experiments/oracle/root-intervals-context-cross.mjs target/release/ixg2
