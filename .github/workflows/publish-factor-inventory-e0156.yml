name: E0156 verified inventory publication
on:
  workflow_dispatch:
    inputs:
      measurement_run_id:
        description: Successful E0156 measurement run to publish
        required: true
        type: string
      measurement_head_sha:
        description: Source revision used by the measurement
        required: true
        type: string
  workflow_run:
    workflows: [E0156 128–160 KiB held-out page inventory expansion, E0156 extended timeout retry after failed measurement]
    types: [completed]
    branches: [main]
permissions:
  actions: write
  contents: write
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] &&
                 unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" &&
                 [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - uses: actions/download-artifact@v4
        with:
          name: E0156-measurement-jsonl
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.measurement_run_id }}
      - name: Materialize and verify E0156 rows and cumulative index
        env:
          E0156_RUN_ID: ${{ github.event.workflow_run.id || inputs.measurement_run_id }}
          E0156_HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.measurement_head_sha }}
          IX_C20_EXPERIMENT: E0156
          IX_C20_PAGE_MIN: 131072
          IX_C20_PAGE_MAX: 163840
          E0156_TIMEOUT_SECONDS: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'E0156 extended timeout retry after failed measurement' && '14400' || '10800' }}
        run: nix develop --no-update-lock-file --command node experiments/xml/publish-factor-inventory-e0156.mjs
      - name: Commit results and verify remote readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/records/E0156.json inventory/manifest.json inventory/batches/E0156 inventory/index/E0156
          if git diff --cached --quiet; then
            echo 'E0156 publication has no changes.'
          else
            git commit -m 'Publish verified E0156 larger-page factor inventory'
            git push origin HEAD:main
          fi
          git fetch origin main
          git show origin/main:experiments/records/E0156.json | jq -e '.status == "verified" and .summary.nodes > 0 and (.pages | length) == 3 and .target_page_width_bytes == [131072,163840] and (.candidate_algorithm | contains("flat-scan"))'
          git show origin/main:inventory/manifest.json | jq -e '.indexed_nodes > 290180 and .index.distinct_factors >= 47547 and .batches[-1].id == "E0156"'
