name: IXG2 bounded memory exact weighted parsing
on:
  push:
    paths:
      - 'experiments/ixg2/streamopt.sh'
      - '.github/workflows/ixg2-streamopt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik8
      - run: bash experiments/ixg2/streamopt.sh
