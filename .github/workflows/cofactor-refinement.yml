name: E0106 cumulative cofactor refinement
on:
  push:
    branches: [main]
    paths:
      - 'experiments/xml/cofactor-refinement.mjs'
      - '.github/workflows/cofactor-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh datasets/acquire.sh enwik9
      - name: Revisit unresolved cofactors using inventory and shared GCD
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout --kill-after=10s 900s node --max-old-space-size=3072 experiments/xml/cofactor-refinement.mjs data/enwik9
          echo E0106_COMPLETE
