name: IXB1 independent rank token context verification
on:
  push:
    paths:
      - 'experiments/oracle/bwt-rank-context-cross.mjs'
      - '.github/workflows/ixb1-rank-context-cross.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && rustc --version
      - run: cargo build --release --locked --bin ixb1
      - run: node experiments/oracle/bwt-rank-context-cross.mjs target/release/ixb1
