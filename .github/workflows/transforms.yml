name: IXT1 reversible arithmetic transform controls
on:
  push:
    paths:
      - 'experiments/oracle/transforms.mjs'
      - 'experiments/oracle/transform-controls.mjs'
      - '.github/workflows/transforms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node --version && node -p 'process.versions.zlib'
      - run: sh datasets/acquire.sh enwik8
      - run: node experiments/oracle/transform-controls.mjs data/enwik8
