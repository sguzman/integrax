name: IXB2 hierarchical blockwise full enwik9
on:
  push:
    paths:
      - 'experiments/ixb1/full-blocks7.sh'
      - '.github/workflows/ixb2-hier-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik9
      - run: bash experiments/ixb1/full-blocks7.sh
