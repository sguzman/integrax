name: E0160 192–224 KiB held-out page inventory expansion
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus (hosted)
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            # Fresh ephemeral runner only: keep each endpoint's partial separate.
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              echo "Trying HTTPS endpoint $host"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 \
                  --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] &&
                 unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" &&
                 [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
              echo "Endpoint $host did not return the verified corpus; trying next endpoint."
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - name: Record pinned runtime versions
        run: |
          nix --version | tee data/E0160.nix-version
          nix develop --no-update-lock-file --command node --version | tee data/E0160.node-version
      - name: Factor three fresh 196,608–229,376-byte pages with twenty frozen controls and paired flat/tree scans
        env:
          IX_C20_EXPERIMENT: E0160
          IX_C20_PAGE_MIN: 196608
          IX_C20_PAGE_MAX: 229376
        run: |
          set -euo pipefail
          /usr/bin/time -v -o data/E0160.time timeout --kill-after=10s 18000s nix develop --no-update-lock-file --command node --max-old-space-size=4096 experiments/xml/factor-inventory-e0152.mjs data/enwik9 > data/E0160.jsonl
          echo E0160_COMPLETE
      - uses: actions/upload-artifact@v4
        with:
          name: E0160-measurement-jsonl
          path: |
            data/E0160.jsonl
            data/E0160.time
            data/E0160.nix-version
            data/E0160.node-version
          retention-days: 90
