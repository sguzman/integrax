name: IXC1 CRT residue controls
on:
  push:
    paths:
      - 'experiments/oracle/crt*.mjs'
      - '.github/workflows/crt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: sh datasets/acquire.sh enwik8
      - run: node experiments/oracle/crt-controls.mjs data/enwik8
