name: E0137 verified inventory publication
on:
  workflow_run:
    workflows: [E0137 flat-scan held-out page inventory expansion]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] &&
                 unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" &&
                 [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - uses: actions/download-artifact@v4
        with:
          name: E0137-measurement-jsonl
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Materialize and verify E0137 rows and cumulative index
        env:
          E0137_RUN_ID: ${{ github.event.workflow_run.id }}
          E0137_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: nix develop --no-update-lock-file --command node experiments/xml/publish-factor-inventory-e0137.mjs
      - name: Commit results and verify remote readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/records/E0137.json inventory/manifest.json inventory/batches/E0137 inventory/index/E0137
          if git diff --cached --quiet; then
            echo 'E0137 publication has no changes.'
          else
            git commit -m 'Publish verified E0137 flat-scan factor inventory'
            git push origin HEAD:main
          fi
          git fetch origin main
          git show origin/main:experiments/records/E0137.json | jq -e '.status == "verified" and .summary.nodes > 0 and (.pages | length) == 3 and (.candidate_algorithm | contains("flat-scan"))'
          git show origin/main:inventory/manifest.json | jq -e '.indexed_nodes > 145523 and .index.distinct_factors > 28721 and .batches[-1].id == "E0137"'
