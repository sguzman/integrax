name: IXG2 native contextual full enwik9
on:
  push:
    paths:
      - 'experiments/ixg2/full-context.sh'
      - '.github/workflows/ixg2-full-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik9
      - run: bash experiments/ixg2/full-context.sh context
