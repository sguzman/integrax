name: E0152 extended timeout retry after failed measurement
on:
  workflow_run:
    workflows: [E0152 64–80 KiB held-out page inventory expansion]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] &&
                 unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" &&
                 [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - name: Record pinned runtime versions
        run: |
          nix --version | tee data/E0152.nix-version
          nix develop --no-update-lock-file --command node --version | tee data/E0152.node-version
      - name: Retry larger-page inventory measurement with extended command budget
        run: |
          set -euo pipefail
          /usr/bin/time -v -o data/E0152.time timeout --kill-after=10s 10200s nix develop --no-update-lock-file --command node --max-old-space-size=4096 experiments/xml/factor-inventory-e0152.mjs data/enwik9 > data/E0152.jsonl
          echo E0152_COMPLETE
      - uses: actions/upload-artifact@v4
        with:
          name: E0152-measurement-jsonl
          path: |
            data/E0152.jsonl
            data/E0152.time
            data/E0152.nix-version
            data/E0152.node-version
          retention-days: 90
