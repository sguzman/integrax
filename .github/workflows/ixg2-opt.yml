name: IXG2 weighted optimal parsing controls
on:
  push:
    paths:
      - 'experiments/ixg2/optimal.sh'
      - '.github/workflows/ixg2-opt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik8
      - run: bash experiments/ixg2/optimal.sh
