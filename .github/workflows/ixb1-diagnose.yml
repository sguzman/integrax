name: IXB1 rank entropy decomposition on fresh target regions
on:
  push:
    paths:
      - 'experiments/ixb1/diagnose.sh'
      - '.github/workflows/ixb1-diagnose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik9
      - run: bash experiments/ixb1/diagnose.sh
