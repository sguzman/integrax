name: E0143 all-children factor intersection
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] && unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" && [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - name: Measure certified child-factor reuse against ranked candidates
        run: |
          set -euo pipefail
          mkdir -p data
          nix --version | tee data/E0143.nix-version
          nix develop --no-update-lock-file --command node --version | tee data/E0143.node-version
          /usr/bin/time -v -o data/E0143.time timeout --kill-after=10s 1200s nix develop --no-update-lock-file --command node --max-old-space-size=3072 experiments/xml/child-intersection-e0143.mjs data/enwik9 > data/E0143.jsonl
          node --input-type=module -e 'import{readFileSync,mkdirSync,writeFileSync}from"node:fs";const r=JSON.parse(readFileSync("data/E0143.jsonl","utf8"));if(r.event!=="E0143_CHILD_INTERSECTION"||r.sample_size<1||r.verified_byte_objects<r.sample_size)throw Error("E0143 verification incomplete");mkdirSync("experiments/records",{recursive:true});writeFileSync("experiments/records/E0143.json",JSON.stringify({...r,command:"nix develop --no-update-lock-file --command node --max-old-space-size=3072 experiments/xml/child-intersection-e0143.mjs data/enwik9"},null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: E0143-child-intersection-results
          path: |
            data/E0143.jsonl
            data/E0143.time
            data/E0143.nix-version
            data/E0143.node-version
          retention-days: 90
      - name: Commit result and verify remote readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/records/E0143.json
          git commit -m 'Publish verified E0143 child-intersection experiment'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:experiments/records/E0143.json | jq -e '.experiment == "E0143" and .sample_size > 0 and .verified_byte_objects >= .sample_size'
