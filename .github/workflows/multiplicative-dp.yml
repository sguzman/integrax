name: IXM2 optimal smooth-divisor controls
on:
  push:
    paths:
      - 'experiments/oracle/multiplicative-dp*.mjs'
      - '.github/workflows/multiplicative-dp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: sh datasets/acquire.sh enwik8
      - run: node experiments/oracle/multiplicative-dp-controls.mjs data/enwik8
