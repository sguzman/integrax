name: E0110 global smaller residual GCD control
on:
  push:
    branches: [main]
    paths:
      - 'experiments/xml/global-smaller-residual.mjs'
      - '.github/workflows/global-smaller-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh datasets/acquire.sh enwik9
      - name: Screen latest inventory and compare strict descendants and global smaller residuals
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout --kill-after=10s 900s node --max-old-space-size=3072 experiments/xml/global-smaller-residual.mjs data/enwik9
          echo E0110_COMPLETE
