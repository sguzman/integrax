name: IXM1 multiplicative controls
on:
  push:
    paths:
      - 'experiments/oracle/multiplicative*.mjs'
      - '.github/workflows/multiplicative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: sh datasets/acquire.sh enwik8
      - run: node experiments/oracle/multiplicative-controls.mjs data/enwik8
