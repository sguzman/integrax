name: IXG2 larger arithmetic dictionary ablation
on:
  push:
    paths:
      - 'experiments/ixg2/larger-dict.sh'
      - '.github/workflows/ixg2-larger-dict.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik8
      - run: bash experiments/ixg2/larger-dict.sh
