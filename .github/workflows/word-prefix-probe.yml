name: E0101 lexical prefix integer residuals
on:
  push:
    branches: [main]
    paths:
      - 'experiments/xml/word-prefix-probe.mjs'
      - '.github/workflows/word-prefix-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh datasets/acquire.sh enwik9
      - name: Matched lexical escape residual archive ablation
        run: |
          set -euo pipefail
          node --version
          /usr/bin/time -v timeout --kill-after=10s 600s node --max-old-space-size=3072 experiments/xml/word-prefix-probe.mjs data/enwik9
          test "$(sha256sum data/enwik9 | cut -d' ' -f1)" = 159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          echo E0101_COMPLETE
