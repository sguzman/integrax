name: IX04 full-corpus arithmetic intervals
on:
  push:
    paths:
      - 'src/bin/ix04.rs'
      - 'experiments/ix04/**'
      - '.github/workflows/ix04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: sh datasets/acquire.sh enwik9
      - run: bash experiments/ix04/controls.sh
