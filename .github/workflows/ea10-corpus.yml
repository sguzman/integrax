name: EA10 verified enwik9 arithmetic samples
on:
  push:
    branches: [research/exponential-approximation]
    paths:
      - research/exponential/ea10-*.mjs
      - .github/workflows/ea10-corpus.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ea10-corpus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  corpus:
    if: github.ref == 'refs/heads/research/exponential-approximation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Acquire, hash, and measure corpus
        run: |
          mkdir -p "$RUNNER_TEMP/ea10-evidence" "$RUNNER_TEMP/ea10-corpus"
          nix develop --no-update-lock-file --command bash -euo pipefail -c '
            export INTEGRAX_DATA_DIR="$RUNNER_TEMP/ea10-corpus"
            export INTEGRAX_DOWNLOAD_ATTEMPTS=3
            if ! sh datasets/acquire.sh enwik9; then
              echo "Primary acquisition failed; trying independent raw mirror"
              mirror="$INTEGRAX_DATA_DIR/enwik9.mirror.tmp"
              curl --proto "=https" --proto-redir "=https" --fail --location --retry 2 --retry-delay 5 --connect-timeout 30 --speed-limit 1024 --speed-time 120 --max-time 900 --output "$mirror" "https://huggingface.co/datasets/ashvardanian/StringWars/resolve/main/enwik9.txt"
              test "$(wc -c < "$mirror")" -eq 1000000000
              test "$(sha256sum "$mirror" | cut -d" " -f1)" = "159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc"
              mv "$mirror" "$INTEGRAX_DATA_DIR/enwik9"
            fi
            sha256sum research/exponential/ea0{9,8}*.mjs research/exponential/ea10-*.mjs
            /usr/bin/time -v node research/exponential/ea10-corpus.mjs "$INTEGRAX_DATA_DIR/enwik9" "$RUNNER_TEMP/ea10-evidence"
            jq -e ".rows | length == 18" "$RUNNER_TEMP/ea10-evidence/results.json"
            # Decoder receives only archive, source and pinned runtime; no corpus or network.
            mkdir -p "$RUNNER_TEMP/ea10-visible"
            cp research/exponential/ea09-codec.mjs "$RUNNER_TEMP/ea10-visible/"
            cp "$RUNNER_TEMP/ea10-evidence/"*.iex "$RUNNER_TEMP/ea10-visible/"
            nodebin=$(realpath "$(command -v node)")
            bashbin=$(realpath "$(command -v bash)")
            utilbin=$(dirname "$(realpath "$(command -v readlink)")")
            test "$(id -u)" -ne 0
            hostnet=$(readlink /proc/self/ns/net)
            for archive in "$RUNNER_TEMP/ea10-visible/"*.iex; do
              name=$(basename "$archive")
              actual=$(bwrap --unshare-user --uid "$(id -u)" --gid "$(id -g)" --unshare-net --unshare-pid --unshare-ipc --unshare-uts --die-with-parent --new-session --cap-drop ALL --clearenv --ro-bind /nix/store /nix/store --ro-bind "$RUNNER_TEMP/ea10-visible" /work --proc /proc --dev /dev --tmpfs /tmp --chdir /work --setenv PATH "$utilbin" -- "$bashbin" -eu -c '"'"'
                test "$(id -u)" -ne 0
                test "$(readlink /proc/self/ns/net)" != "$1"
                test ! -e "$2"
                test ! -e /work/enwik9
                exec "$3" --input-type=module -e "import {decode} from \"./ea09-codec.mjs\";import {readFileSync} from \"node:fs\";process.stdout.write(decode(readFileSync(process.argv[1])))" "$4"
              '"'"' sandbox "$hostnet" "$INTEGRAX_DATA_DIR/enwik9" "$nodebin" "$name" | sha256sum | cut -d" " -f1)
              test "$actual" = "$(cat "$RUNNER_TEMP/ea10-evidence/${name%.iex}.sha256")"
            done
            printf "18 isolated decode hashes verified\n" | tee "$RUNNER_TEMP/ea10-evidence/isolation.txt"
            cat "$RUNNER_TEMP/ea10-evidence/results.json"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ea10-corpus-evidence
          path: |
            ${{ runner.temp }}/ea10-evidence/results.json
            ${{ runner.temp }}/ea10-evidence/isolation.txt
          if-no-files-found: warn
