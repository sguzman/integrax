name: E0117 enlarged inventory scale closure
on:
  push:
    branches: [main]
    paths:
      - 'experiments/xml/inventory-scale-closure.mjs'
      - '.github/workflows/inventory-scale-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh datasets/acquire.sh enwik9
      - name: Measure incremental factor reuse by size and kind
        run: |
          set -euo pipefail
          /usr/bin/time -v timeout --kill-after=10s 900s node --max-old-space-size=3072 experiments/xml/inventory-scale-closure.mjs data/enwik9
          echo E0117_COMPLETE
