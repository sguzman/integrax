name: IXG2 exact history distance boundary
on:
  push:
    paths:
      - 'experiments/oracle/root-intervals-boundary-cross.mjs'
      - '.github/workflows/ixg2-boundary-cross.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && rustc --version
      - run: cargo test --locked --release --bin ixg2 exact_history_distance_limit
      - run: cargo build --locked --release --bin ixg2
      - run: node experiments/oracle/root-intervals-boundary-cross.mjs target/release/ixg2
