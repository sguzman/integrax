name: IXB2 independent hierarchical block verification
on:
  push:
    paths:
      - 'experiments/oracle/ixb2-hier-cross.mjs'
      - '.github/workflows/ixb2-hier-cross.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && rustc --version
      - run: cargo test --release --locked --bin ixb1
      - run: cargo build --release --locked --bin ixb1
      - run: node experiments/oracle/ixb2-hier-cross.mjs target/release/ixb1
