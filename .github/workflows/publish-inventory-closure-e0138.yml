name: E0138 verified residual refinement publication
on:
  workflow_run:
    workflows: [E0138 propagate E0137 factors across unresolved objects]
    types: [completed]
    branches: [main]
permissions:
  actions: write
  contents: write
concurrency:
  group: c20-factor-inventory
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore verified corpus cache
        uses: actions/cache@v4
        with:
          path: data/enwik9
          key: enwik9-sha256-159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
      - name: Acquire and verify authentic corpus
        run: |
          set -euo pipefail
          mkdir -p data
          expected=159b85351e5f76e60cbe32e04c677847a9ecba3adc79addab6f4c6c7aa3744bc
          if [ ! -f data/enwik9 ]; then
            for host in mattmahoney.net www.mattmahoney.net; do
              zip="data/enwik9.${host}.zip.tmp"
              raw="data/enwik9.${host}.raw.tmp"
              if curl --proto '=https' --proto-redir '=https' --location --fail --http1.1 --connect-timeout 30 --max-time 180 --output "$zip" "https://$host/dc/enwik9.zip" &&
                 [ "$(wc -c < "$zip")" -eq 322592222 ] &&
                 unzip -tq "$zip" &&
                 unzip -p "$zip" enwik9 > "$raw" &&
                 [ "$(wc -c < "$raw")" -eq 1000000000 ] &&
                 printf '%s  %s\n' "$expected" "$raw" | sha256sum -c -; then
                mv "$raw" data/enwik9
                rm -f "$zip"
                break
              fi
            done
          fi
          test -f data/enwik9
          printf '%s  %s\n' "$expected" data/enwik9 | sha256sum -c -
          sh datasets/acquire.sh enwik9
      - uses: actions/download-artifact@v4
        with:
          name: E0138-closure-jsonl
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate and persist exact E0138 refinements
        env:
          E0138_RUN_ID: ${{ github.event.workflow_run.id }}
          E0138_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: nix develop --no-update-lock-file --command node experiments/xml/publish-inventory-closure-e0135.mjs
      - name: Commit results and verify remote readback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/records/E0138.json inventory/refinements/E0138.json inventory/manifest.json
          git commit -m 'Publish verified E0138 inventory closure'
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:experiments/records/E0138.json | jq -e '.experiment == "E0138" and .summary.improved == .refinement_rows'
          git show origin/main:inventory/manifest.json | jq -e '.refinements[-1].id == "E0138"'
      - name: Dispatch E0139 beyond the workflow_run chain limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/index-algorithm-e0139.yml/dispatches" -f ref=main
